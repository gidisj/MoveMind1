<div style="background: #f4f6f9; padding: 20px; border-radius: 12px; max-width: 500px; margin: 20px auto; font-family: sans-serif; direction: rtl; text-align: right; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
    <h3 style="color: #2c3e50; margin-bottom: 15px;">🧠 فحص المؤشرات الذكي (MoveMind AI)</h3>
    <p style="font-size: 14px; color: #7f8c8d;">أدخل بياناتك الحالية ليقوم النظام بتحليل مستوى الخطورة النفسية والبدنية:</p>
    
    <label style="display:block; margin: 10px 0 5px;">الجنس:</label>
    <select id="gender" style="width:100%; padding:8px; border-radius:6px; border:1px solid #ccc;">
        <option value="أنثى">أنثى (عبء إحصائي أعلى)</option>
        <option value="ذكر">ذكر</option>
    </select>

    <label style="display:block; margin: 10px 0 5px;">دقائق النشاط البدني الأسبوعي:</label>
    <input type="number" id="activity" value="150" style="width:96%; padding:8px; border-radius:6px; border:1px solid #ccc;">

    <label style="display:block; margin: 10px 0 5px;">معدل ساعات النوم اليومي:</label>
    <input type="number" id="sleep" value="7" style="width:96%; padding:8px; border-radius:6px; border:1px solid #ccc;">

    <button onclick="runAIModel()" style="width:100%; background:#27ae60; color:white; padding:10px; border:none; border-radius:6px; margin-top:15px; cursor:pointer; font-weight:bold;">تشغيل خوارزمية التنبؤ الفوري</button>

    <div id="aiResult" style="margin-top: 15px; font-weight: bold; padding: 10px; border-radius: 6px; display: none;"></div>
</div>

<script>
function runAIModel() {
    // 1. سحب مدخلات الطالب من الواجهة
    const gender = document.getElementById('gender').value;
    const activity = parseInt(document.getElementById('activity').value);
    const sleep = parseInt(document.getElementById('sleep').value);
    
    const resultDiv = document.getElementById('aiResult');
    resultDiv.style.display = "block";
    
    // 2. تطبيق منطق الأوزان الإحصائية المستمدة من مسح عمان 2025
    let score = 0;
    if (gender === "أنثى") score += 2; 
    if (activity < 150) score += 3;
    if (sleep < 6) score += 2;
    
    // 3. اتخاذ القرار وإظهار النتيجة الذكية فوراً للطالب
    if (score >= 5) {
        resultDiv.style.background = "#e74c3c";
        resultDiv.style.color = "white";
        resultDiv.innerHTML = "⚠️ تنبيه خطورة مرتفعة: مؤشراتك تضعك في نطاق العبء النفسي والبدني. ننصحك بتفعيل برنامج MoveMind الجامعي فوراً.";
    } else {
        resultDiv.style.background = "#2ecc71";
        resultDiv.style.color = "white";
        resultDiv.innerHTML = "✅ وضع آمن: مؤشراتك الحالية متزنة وصحية! استمر في الحفاظ على هذا المعدل النشط.";
    }
}
</script>
